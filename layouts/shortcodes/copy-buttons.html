<!-- Adds a "copy" button to every code block on the page it is called from.
     Project-level shortcode: does not touch the vendored theme. Opt in by
     calling the copy-buttons shortcode near the bottom of a post's content.
     (Do not write the shortcode's own call syntax in this file -- Hugo parses
     the braces here as a template action even inside an HTML comment.) -->
<style>
.ff-codewrap { position: relative; }
.ff-copy {
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    z-index: 2;
    padding: 0.2rem 0.55rem;
    font: 600 0.75rem/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #444;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s ease-in-out;
}
.ff-codewrap:hover .ff-copy,
.ff-copy:focus { opacity: 1; }
.ff-copy:hover { background: #f2f2f2; }
.ff-copy.ff-done { color: #1a7f37; border-color: #1a7f37; }
/* Touch devices have no hover, so never hide it there. */
@media (hover: none) { .ff-copy { opacity: 1; } }
</style>
<script>
(function () {
    function ready(fn) {
        if (document.readyState !== "loading") { fn(); }
        else { document.addEventListener("DOMContentLoaded", fn); }
    }

    function copyText(text) {
        // navigator.clipboard needs a secure context (https or localhost).
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand("copy") ? resolve() : reject();
            } catch (e) {
                reject(e);
            } finally {
                document.body.removeChild(ta);
            }
        });
    }

    ready(function () {
        var blocks = document.querySelectorAll(".post pre > code");
        Array.prototype.forEach.call(blocks, function (code) {
            var pre = code.parentNode;
            if (pre.parentNode.classList.contains("ff-codewrap")) { return; }

            var wrap = document.createElement("div");
            wrap.className = "ff-codewrap";
            pre.parentNode.insertBefore(wrap, pre);
            wrap.appendChild(pre);

            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "ff-copy";
            btn.textContent = "copy";
            btn.setAttribute("aria-label", "Copy code to clipboard");
            wrap.appendChild(btn);

            btn.addEventListener("click", function () {
                // Read from <code>, so the button's own label is never copied.
                copyText(code.textContent).then(function () {
                    btn.textContent = "copied!";
                    btn.classList.add("ff-done");
                }, function () {
                    btn.textContent = "press ⌘C";
                }).then(function () {
                    setTimeout(function () {
                        btn.textContent = "copy";
                        btn.classList.remove("ff-done");
                    }, 1500);
                });
            });
        });
    });
})();
</script>
