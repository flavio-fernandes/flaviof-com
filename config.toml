BaseURL = "https://www.flaviof.com/blog2/"
locale = "en-us"
title = "flaviof_blog2"
theme = "helix"
# Analytics is off. The old Universal Analytics property (UA-54082757-1) was
# shut down by Google on 1 July 2023 and collects nothing, and Hugo's internal
# template stopped emitting anything at all for a UA- id -- the built pages
# have carried no analytics for some time regardless of this setting. To turn
# it back on, create a GA4 property and put its G-XXXXXXXXXX id here:
#   googleAnalytics = "G-XXXXXXXXXX"
ignoreFiles = [ "~$", "\\.gitignore$", "\\.gitkeep$" ]
enableRobotsTXT = true
pygmentsUseClasses = true

# static/img is synced by Dropbox, which leaves macOS resource-fork droppings
# (AppleDouble ._* files and .DS_Store) in the tree. ignoreFiles above only
# applies to content; Hugo copies static/ verbatim, so these used to get
# published -- img/.DS_Store and img/__MACOSX/ reached the live server that
# way. Excluding them at the mount keeps them out of public/ even when they
# reappear locally.
[[module.mounts]]
    source = "static"
    target = "static"
    files = [
        "! .DS_Store", "! **/.DS_Store",
        "! ._*", "! **/._*",
        "! __MACOSX/**", "! **/__MACOSX/**",
    ]
